<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 | CAPS 교회지원센터</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="CAPS 교회지원센터 관리자 화면">
  <meta name="theme-color" content="#1D4ED8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%231D4ED8'/%3E%3Cpath d='M20 9.5v21M13 16.5h14' stroke='%23F59E0B' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin">

  <!-- 게이트(로그인/승인 대기)에서 재사용하는 로고 -->
  <template id="gateLogo">
    <svg class="logo-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <rect width="40" height="40" rx="10" fill="var(--brand-800)"/>
      <path d="M20 9.5v21M13 16.5h14" stroke="var(--gold-400)" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M27.5 25.4a8.4 8.4 0 0 1-15 0" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
  </template>

  <!-- 로그인 / 권한 안내 -->
  <div class="gate" id="admGate" hidden></div>

  <!-- 관리자 화면 -->
  <div id="admShell" hidden>
    <div class="adm-mobile-bar">
      <button type="button" class="adm-burger" id="admBurger" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
      <strong id="admMobileTitle">관리자</strong>
    </div>

    <div class="adm">
      <aside class="adm-side" id="admSide">
        <a class="adm-brand" href="index.html">
          <svg class="logo-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <rect width="40" height="40" rx="10" fill="#2563EB"/>
            <path d="M20 9.5v21M13 16.5h14" stroke="#F59E0B" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M27.5 25.4a8.4 8.4 0 0 1-15 0" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
          <span class="adm-brand-text">
            <strong>관리자</strong>
            <small>CAPS 교회지원센터</small>
          </span>
        </a>

        <nav id="admNav" aria-label="관리자 메뉴"></nav>

        <div class="adm-side-foot">
          <div class="adm-me" id="admMe"></div>
          <div class="adm-mode" id="admMode" hidden>
            데모 모드 — 이 브라우저에만 저장됩니다.
            실제 운영은 <code>firebase-config.js</code> 설정 후 시작됩니다.
          </div>
          <button type="button" class="adm-link" id="admSignOut">
            <svg class="adm-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
            </svg>
            <span class="adm-link-text">로그아웃</span>
          </button>
          <a class="adm-link" href="index.html">
            <svg class="adm-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m3 10.5 9-7.5 9 7.5V20a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 20v-9.5Z"/>
            </svg>
            <span class="adm-link-text">홈페이지 보기</span>
          </a>
        </div>
      </aside>

      <main class="adm-main">
        <div class="adm-head">
          <div class="adm-head-row">
            <div>
              <h1 id="admTitle">관리자</h1>
              <p id="admDesc"></p>
            </div>
            <div id="admActions"></div>
          </div>
        </div>
        <div id="admBody"></div>
      </main>
    </div>
  </div>

  <!-- 상세 서랍 -->
  <div class="drawer" id="drawer" hidden>
    <div class="drawer-backdrop"></div>
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <div class="drawer-head">
        <h2 id="drawerTitle"></h2>
        <p id="drawerSub"></p>
        <button type="button" class="drawer-close" id="drawerClose" aria-label="닫기">×</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/rules-text.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/profile.js"></script>
  <script src="assets/js/admin/app.js"></script>
  <script src="assets/js/admin/dashboard.js"></script>
  <script src="assets/js/admin/tasks.js"></script>
  <script src="assets/js/admin/requests.js"></script>
  <script src="assets/js/admin/customers.js"></script>
  <script src="assets/js/admin/consents.js"></script>
  <script src="assets/js/admin/subscriptions.js"></script>
  <script src="assets/js/admin/settlement.js"></script>
  <script src="assets/js/admin/services.js"></script>
  <script src="assets/js/admin/members.js"></script>
  <script src="assets/js/admin/settings.js"></script>
  <script src="assets/js/admin/rules.js"></script>
  <script>
    // gateLogo 는 <template> 이므로 innerHTML 접근을 위해 content 를 펼쳐 둡니다.
    (function () {
      var tpl = document.getElementById('gateLogo');
      var holder = document.createElement('div');
      holder.id = 'gateLogo';
      holder.hidden = true;
      holder.appendChild(tpl.content.cloneNode(true));
      tpl.replaceWith(holder);
      window.CAPSAdmin.boot();
    })();
  </script>
</body>
</html>
