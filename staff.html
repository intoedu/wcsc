<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>직원 로그인 | CAPS 교회지원센터</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="CAPS 교회지원센터 직원 전용 로그인 및 계정 신청">
  <meta name="theme-color" content="#0E2340">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%230E2340'/%3E%3Cpath d='M20 9.5v21M13 16.5h14' stroke='%23C69749' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="staff">

<div class="sp">
  <!-- 왼쪽: 브랜드 안내 -->
  <aside class="sp-aside">
    <a class="sp-brand" href="index.html">
      <svg class="logo-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <rect width="40" height="40" rx="10" fill="#143355"/>
        <path d="M20 9.5v21M13 16.5h14" stroke="#C69749" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M27.5 25.4a8.4 8.4 0 0 1-15 0" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <span class="sp-brand-text">
        <strong>CAPS 교회지원센터</strong>
        <small>Church Assist Platform Service</small>
      </span>
    </a>

    <div class="sp-copy">
      <span class="sp-badge">센터 직원 전용</span>
      <h1>업무 시스템에<br>로그인해 주세요</h1>
      <p>
        교회 신청 접수부터 고객·구독 관리, 정산, 홈페이지 항목 수정까지
        센터 업무를 처리하는 화면입니다.
      </p>
      <ul class="sp-list">
        <li>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 12.5 5 5 10-11"/></svg>
          <span>배정된 신청 건과 진행 상황 관리</span>
        </li>
        <li>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 12.5 5 5 10-11"/></svg>
          <span>고객 교회별 구독 현황과 정산 처리</span>
        </li>
        <li>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 12.5 5 5 10-11"/></svg>
          <span>권한은 최고관리자가 항목별로 부여합니다</span>
        </li>
      </ul>
    </div>

    <p class="sp-foot">
      교회 관계자시라면 <a href="index.html">홈페이지</a>에서 지원 신청을 이용해 주세요.
    </p>
  </aside>

  <!-- 오른쪽: 로그인 / 신청 -->
  <main class="sp-main">
    <div class="sp-card">
      <!-- 로그인 · 계정 신청 -->
      <div id="spGate">
        <div class="sp-tabs">
          <button type="button" class="sp-tab is-on" data-tab="login">로그인</button>
          <button type="button" class="sp-tab" data-tab="signup">직원 계정 신청</button>
        </div>

        <div class="sp-card-body">
          <!-- 로그인 -->
          <form class="sp-form" id="spLoginForm" data-pane="login" novalidate>
            <h2 style="margin-bottom:18px">직원 로그인</h2>
            <div class="field">
              <label for="spEmail">이메일</label>
              <input type="email" id="spEmail" autocomplete="email" required placeholder="name@caps.or.kr">
            </div>
            <div class="field">
              <label for="spPw">비밀번호</label>
              <div class="pw-row">
                <input type="password" id="spPw" autocomplete="current-password" required>
                <button type="button" class="pw-toggle" data-pw="spPw">표시</button>
              </div>
            </div>
            <p class="auth-err" id="spLoginErr" hidden></p>
            <button type="submit" class="btn btn-primary btn-block btn-lg">로그인</button>
            <button type="button" class="btn btn-outline btn-block" id="spGoogle">Google 계정으로 로그인</button>
            <div class="sp-switch">
              <button type="button" id="spReset">비밀번호를 잊으셨나요?</button>
            </div>
          </form>

          <!-- 계정 신청 -->
          <form class="sp-form" id="spSignupForm" data-pane="signup" hidden novalidate>
            <h2 style="margin-bottom:10px">직원 계정 신청</h2>
            <p class="sp-lead" style="margin-bottom:20px">
              신청 후 <strong>최고관리자 승인</strong>을 받으면 업무 시스템을 이용할 수 있습니다.
            </p>
            <div class="field">
              <label for="spName">성함 <em class="req">필수</em></label>
              <input type="text" id="spName" autocomplete="name" required placeholder="예: 박요엘">
            </div>
            <div class="field">
              <label for="spSuEmail">이메일 <em class="req">필수</em></label>
              <input type="email" id="spSuEmail" autocomplete="email" required placeholder="name@caps.or.kr">
            </div>
            <div class="field">
              <label for="spPhone">연락처 <span class="opt">선택</span></label>
              <input type="tel" id="spPhone" autocomplete="tel" placeholder="010-0000-0000">
            </div>
            <div class="field">
              <label for="spSuPw">비밀번호 <em class="req">필수</em></label>
              <div class="pw-row">
                <input type="password" id="spSuPw" autocomplete="new-password" required minlength="6" placeholder="6자 이상">
                <button type="button" class="pw-toggle" data-pw="spSuPw">표시</button>
              </div>
            </div>
            <label class="check-line">
              <input type="checkbox" id="spAgree" required>
              <span>개인정보 수집 · 이용에 동의합니다. <em class="req">필수</em></span>
            </label>
            <p class="auth-err" id="spSignupErr" hidden></p>
            <button type="submit" class="btn btn-primary btn-block btn-lg">계정 신청하기</button>
          </form>
        </div>
      </div>

      <!-- 상태 안내 (승인 대기 / 고객 계정 / 연결 실패) -->
      <div class="sp-card-body" id="spState" hidden></div>
    </div>
  </main>
</div>

<script src="assets/js/firebase-config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/staff.js"></script>
</body>
</html>
